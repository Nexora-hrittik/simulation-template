name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify architectural boundaries
        run: npm run check:boundary

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build standalone preview harness
        run: npm run build
